<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Verse Game - Test Your Knowledge!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 200px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 2.5em;
            font-weight: bold;
        }

        .verse-container {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            font-style: italic;
            color: #333;
            line-height: 1.8;
        }

        .verse-reference {
            text-align: right;
            font-weight: bold;
            color: #667eea;
            margin-top: 15px;
            font-style: normal;
        }

        .game-area {
            margin-bottom: 30px;
        }

        .instructions {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #1565c0;
            text-align: center;
            font-size: 1.1em;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            min-height: 80px;
        }

        .word-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .word-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .word-btn.used {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .sentence-area {
            background: white;
            border: 3px dashed #667eea;
            padding: 25px;
            border-radius: 10px;
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .placed-word {
            background: #4caf50;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            background: #ff9800;
            color: white;
        }

        .btn-secondary:hover {
            background: #f57c00;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #388e3c;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        .game-over {
            display: none;
            text-align: center;
        }

        .final-score {
            font-size: 4em;
            color: #667eea;
            font-weight: bold;
            margin: 30px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .celebration {
            font-size: 1.5em;
            color: #4caf50;
            margin-bottom: 20px;
        }

        .feedback {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #856404;
            display: none;
        }

        .feedback.success {
            background: #d4edda;
            border-color: #4caf50;
            color: #155724;
        }

        .feedback.error {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .info-box {
                min-width: 150px;
                padding: 15px 25px;
            }

            .info-value {
                font-size: 2em;
            }
        }

        .hidden {
            display: none;
        }

        .loader {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="gameScreen">
            <h1>📖 Bible Verse Challenge 📖</h1>
            <p class="subtitle">Complete the verse and test your knowledge!</p>

            <div class="game-info">
                <div class="info-box">
                    <div class="info-label">⏰ Time Left</div>
                    <div class="info-value" id="timer">9:00</div>
                </div>
                <div class="info-box">
                    <div class="info-label">⭐ Score</div>
                    <div class="info-value" id="score">0</div>
                </div>
            </div>

            <div class="verse-container">
                <div id="verseDisplay">Loading Bible verse...</div>
                <div class="verse-reference" id="verseReference"></div>
            </div>

            <div class="game-area">
                <div class="instructions">
                    Click the words below to complete the missing parts of the verse!
                </div>

                <div class="word-bank" id="wordBank"></div>

                <div class="sentence-area" id="sentenceArea"></div>

                <div class="feedback" id="feedback"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
                <button class="btn btn-secondary" id="clearBtn" onclick="clearAnswer()">Clear</button>
                <button class="btn btn-success" id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Question</button>
            </div>
        </div>

        <div id="gameOverScreen" class="game-over">
            <h1>🎮 Game Over! 🎮</h1>
            <div class="celebration" id="celebration"></div>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size: 1.3em; color: #666; margin-bottom: 30px;">Great job on completing the challenge!</p>
            <button class="btn btn-primary" onclick="startNewGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Game state
        let score = 0;
        let timeLeft = 540; // 9 minutes in seconds
        let timerInterval;
        let currentVerse = {};
        let userAnswer = [];
        let gameActive = true;

        // Bible verses database with missing words
        const bibleVerses = [
            {
                verse: "For God so loved the {world} that he gave his one and only {Son}, that whoever believes in him shall not perish but have eternal {life}.",
                reference: "John 3:16",
                missing: ["world", "Son", "life"],
                distractors: ["earth", "Father", "death", "peace", "joy"]
            },
            {
                verse: "I can do all things through {Christ} who {strengthens} me.",
                reference: "Philippians 4:13",
                missing: ["Christ", "strengthens"],
                distractors: ["God", "helps", "saves", "loves", "guides"]
            },
            {
                verse: "The {Lord} is my shepherd, I lack {nothing}.",
                reference: "Psalm 23:1",
                missing: ["Lord", "nothing"],
                distractors: ["God", "Father", "everything", "something", "peace"]
            },
            {
                verse: "Trust in the Lord with all your {heart} and lean not on your own {understanding}.",
                reference: "Proverbs 3:5",
                missing: ["heart", "understanding"],
                distractors: ["mind", "soul", "knowledge", "wisdom", "strength"]
            },
            {
                verse: "Be strong and {courageous}. Do not be afraid; do not be {discouraged}, for the Lord your God will be with you wherever you go.",
                reference: "Joshua 1:9",
                missing: ["courageous", "discouraged"],
                distractors: ["brave", "fearful", "worried", "anxious", "bold"]
            },
            {
                verse: "For I know the {plans} I have for you, declares the Lord, plans to {prosper} you and not to harm you, plans to give you hope and a future.",
                reference: "Jeremiah 29:11",
                missing: ["plans", "prosper"],
                distractors: ["thoughts", "ideas", "bless", "help", "save"]
            },
            {
                verse: "Love is {patient}, love is {kind}. It does not envy, it does not boast, it is not proud.",
                reference: "1 Corinthians 13:4",
                missing: ["patient", "kind"],
                distractors: ["gentle", "good", "sweet", "nice", "caring"]
            },
            {
                verse: "But the fruit of the Spirit is love, joy, {peace}, forbearance, kindness, goodness, {faithfulness}.",
                reference: "Galatians 5:22",
                missing: ["peace", "faithfulness"],
                distractors: ["happiness", "trust", "loyalty", "hope", "grace"]
            },
            {
                verse: "Do not be anxious about anything, but in every situation, by {prayer} and petition, with {thanksgiving}, present your requests to God.",
                reference: "Philippians 4:6",
                missing: ["prayer", "thanksgiving"],
                distractors: ["worship", "praise", "gratitude", "faith", "hope"]
            },
            {
                verse: "In the beginning {God} created the heavens and the {earth}.",
                reference: "Genesis 1:1",
                missing: ["God", "earth"],
                distractors: ["Lord", "Christ", "world", "universe", "land"]
            }
        ];

        // Initialize game
        function initGame() {
            startTimer();
            loadVerse();
        }

        // Start countdown timer
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft > 0 && gameActive) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // Update timer display
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Load a verse based on current time (changes each hour)
        function loadVerse() {
            const currentHour = new Date().getHours();
            const verseIndex = currentHour % bibleVerses.length;
            currentVerse = JSON.parse(JSON.stringify(bibleVerses[verseIndex]));
            
            // Display verse with blanks
            const verseText = currentVerse.verse.replace(/{([^}]+)}/g, '_____');
            document.getElementById('verseDisplay').textContent = verseText;
            document.getElementById('verseReference').textContent = currentVerse.reference;

            // Create word bank
            createWordBank();
            userAnswer = [];
            document.getElementById('sentenceArea').innerHTML = '';
            hideFeedback();
        }

        // Create word bank with correct answers and distractors
        function createWordBank() {
            const words = [...currentVerse.missing, ...currentVerse.distractors];
            // Shuffle words
            for (let i = words.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [words[i], words[j]] = [words[j], words[i]];
            }

            const wordBank = document.getElementById('wordBank');
            wordBank.innerHTML = '';
            
            words.forEach((word, index) => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.textContent = word;
                btn.onclick = () => selectWord(word, index);
                btn.id = `word-${index}`;
                wordBank.appendChild(btn);
            });
        }

        // Select a word from word bank
        function selectWord(word, index) {
            const btn = document.getElementById(`word-${index}`);
            if (btn.classList.contains('used')) return;

            userAnswer.push(word);
            btn.classList.add('used');
            
            const sentenceArea = document.getElementById('sentenceArea');
            const wordSpan = document.createElement('span');
            wordSpan.className = 'placed-word';
            wordSpan.textContent = word;
            wordSpan.onclick = () => removeWord(word, index);
            sentenceArea.appendChild(wordSpan);
        }

        // Remove a word from sentence area
        function removeWord(word, index) {
            const wordIndex = userAnswer.indexOf(word);
            if (wordIndex > -1) {
                userAnswer.splice(wordIndex, 1);
            }

            const btn = document.getElementById(`word-${index}`);
            btn.classList.remove('used');

            const sentenceArea = document.getElementById('sentenceArea');
            const words = sentenceArea.getElementsByClassName('placed-word');
            for (let i = 0; i < words.length; i++) {
                if (words[i].textContent === word) {
                    sentenceArea.removeChild(words[i]);
                    break;
                }
            }
        }

        // Check if answer is correct
        function checkAnswer() {
            if (userAnswer.length !== currentVerse.missing.length) {
                showFeedback('Please fill in all the blanks!', 'error');
                return;
            }

            const isCorrect = JSON.stringify(userAnswer) === JSON.stringify(currentVerse.missing);
            
            if (isCorrect) {
                score += 100;
                document.getElementById('score').textContent = score;
                showFeedback('🎉 Correct! Great job! Click Next Question to continue.', 'success');
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('clearBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'inline-block';
            } else {
                score = Math.max(0, score - 20);
                document.getElementById('score').textContent = score;
                showFeedback('❌ Not quite right. Try again!', 'error');
            }
        }

        // Clear current answer
        function clearAnswer() {
            userAnswer = [];
            document.getElementById('sentenceArea').innerHTML = '';
            
            const buttons = document.querySelectorAll('.word-btn');
            buttons.forEach(btn => btn.classList.remove('used'));
            hideFeedback();
        }

        // Load next question
        function nextQuestion() {
            // Get a random verse different from current one
            let newIndex;
            const currentIndex = bibleVerses.findIndex(v => v.reference === currentVerse.reference);
            do {
                newIndex = Math.floor(Math.random() * bibleVerses.length);
            } while (newIndex === currentIndex);

            currentVerse = JSON.parse(JSON.stringify(bibleVerses[newIndex]));
            
            const verseText = currentVerse.verse.replace(/{([^}]+)}/g, '_____');
            document.getElementById('verseDisplay').textContent = verseText;
            document.getElementById('verseReference').textContent = currentVerse.reference;

            createWordBank();
            userAnswer = [];
            document.getElementById('sentenceArea').innerHTML = '';
            hideFeedback();
            
            document.getElementById('checkBtn').style.display = 'inline-block';
            document.getElementById('clearBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        // Show feedback message
        function showFeedback(message, type) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.className = `feedback ${type}`;
            feedback.style.display = 'block';
        }

        // Hide feedback message
        function hideFeedback() {
            document.getElementById('feedback').style.display = 'none';
        }

        // End game
        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = score;

            let celebrationText = '';
            if (score >= 500) {
                celebrationText = '🌟 Outstanding! You are a Bible Scholar! 🌟';
            } else if (score >= 300) {
                celebrationText = '👏 Great work! Keep studying the Word! 👏';
            } else if (score >= 100) {
                celebrationText = '👍 Good effort! Keep practicing! 👍';
            } else {
                celebrationText = '💪 Nice try! Every journey begins with a step! 💪';
            }
            document.getElementById('celebration').textContent = celebrationText;
        }

        // Start new game
        function startNewGame() {
            score = 0;
            timeLeft = 540;
            gameActive = true;
            userAnswer = [];
            
            document.getElementById('score').textContent = score;
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('checkBtn').style.display = 'inline-block';
            document.getElementById('clearBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
            
            initGame();
        }

        // Start game when page loads
        window.onload = initGame;
    </script>
</body>
</html>
